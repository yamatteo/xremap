# Four stages, each remapping the output of the one before, then keymap.
#
# 1. Physical keys to logical keys. The only device-specific part: another
#    keyboard needs only a different stage 1 (see stage_one_visualization.md).
#    The logical keyboard is:
#
#      TAB    Q     W     F     P     G       J     L     U     Y     ;     DELETE
#      BKSP   A     R     S     T     D       H     N     E     I     O     ENTER
#      LSHIFT Z     X     C     V     B       K     M     ,     .     /     RSHIFT
#      CAPS   LCTRL LMETA LALT  SPACE SPACE   SPACE SPACE RALT  RMETA RCTRL ESC
#
#    The numpads have no CAPS and no DELETE.
# 2. Layer-taps. They come before the layers, so keys pressed while one is
#    undecided are replayed after the mode change, and remapped in the new mode.
# 3. Layers, per mode.
# 4. Home-row mods. Where a layer changed a key (arrows in move_right, digits
#    in numbers_right), its tap-hold can't trigger.
pipeline:
  # --- 1. Physical to logical
  - stage:
      left:
        device:
          only:
            - /dev/input/by-id/numpad-left-kbd
            - /dev/input/by-id/numpad-left-consumer
        remap:
          KP0: TAB
          KP1: Q
          KP4: W
          KP7: F
          NUMLOCK: P
          HOMEPAGE: G

          SPACE: BACKSPACE
          KP2: A
          KP5: R
          KP8: S
          KPSLASH: T
          TAB: D

          KPDOT: LEFTSHIFT
          KP3: Z
          KP6: X
          KP9: C
          KPASTERISK: V
          MAIL: B

          KPENTER: LEFTCTRL
          KPPLUS: LEFTMETA
          KPMINUS: LEFTALT
          BACKSPACE: SPACE
          CALC: SPACE

      right:
        device:
          only:
            - /dev/input/by-id/numpad-right-kbd
            - /dev/input/by-id/numpad-right-consumer
        remap:
          CALC: J
          BACKSPACE: L
          KPMINUS: U
          KPPLUS: Y
          KPENTER: SEMICOLON

          MAIL: H
          KPASTERISK: N
          KP9: E
          KP6: I
          KP3: O
          KPDOT: ENTER

          TAB: K
          KPSLASH: M
          KP8: COMMA
          KP5: DOT
          KP2: SLASH
          SPACE: RIGHTSHIFT

          HOMEPAGE: SPACE
          NUMLOCK: SPACE
          KP7: RIGHTALT
          KP4: RIGHTMETA
          KP1: RIGHTCTRL
          KP0: ESC

  # --- 2. Layer-taps
  - stage:
      left_layer_tap:
        # In numbers_left A is left alone, so holding it can't reset the mode
        # while O is held.
        mode: [default, move_left, move_right, numbers_right]
        remap:
          A:                    # hold for right-pad numbers
            tap_hold_next_release:
              tap: A
              hold: { set_mode: numbers_right }
              timeout: 200
          Z:                    # hold for right-pad move mode
            tap_hold_next_release:
              tap: Z
              hold: { set_mode: move_right }
              timeout: 200

      right_layer_tap:
        # In numbers_right O is -, and holding it can't reset the mode while
        # A is held.
        mode: [default, move_left, move_right, numbers_left]
        remap:
          O:                    # hold for left-pad numbers
            tap_hold_next_release:
              tap: O
              hold: { set_mode: numbers_left }
              timeout: 200
          SLASH:                # hold for left-pad move mode
            tap_hold_next_release:
              tap: SLASH
              hold: { set_mode: move_left }
              timeout: 200

  # --- 3. Layers
  - stage:
      # F keys on the left side. The brackets are in the keymap below, since
      # they need Shift combos.
      left_numbers:
        mode: [numbers_left]
        remap:
          TAB: F1
          Q: F2
          W: F3
          F: F4
          BACKSPACE: F5
          A: F6
          R: F7
          S: F8
          LEFTSHIFT: F9
          Z: F10
          X: F11
          C: F12

      left_move:
        mode: [move_left]
        remap:
          TAB: ESC

      right_move:
        mode: [move_right]
        remap:
          L: HOME
          U: KEY_UP
          Y: PAGEUP
          SEMICOLON: CAPSLOCK

          N: KEY_LEFT
          I: KEY_RIGHT

          M: END
          COMMA: KEY_DOWN
          DOT: PAGEDOWN

      right_numbers:
        mode: [numbers_right]
        remap:
          J: GRAVE
          L: KEY_7
          U: KEY_8
          Y: KEY_9
          SEMICOLON: BACKSLASH

          H: APOSTROPHE
          N: KEY_4
          E: KEY_5
          I: KEY_6
          O: MINUS

          K: KEY_0
          M: KEY_1
          COMMA: KEY_2
          DOT: KEY_3
          SLASH: EQUAL

  # --- 4. Home-row mods
  - stage:
      homerow:
        remap:
          R:
            tap_hold_next_release:
              tap: R
              hold: LEFTALT
              timeout: 200
          S:
            tap_hold_next_release:
              tap: S
              hold: LEFTSHIFT
              timeout: 200
          E:
            tap_hold_next_release:
              tap: E
              hold: RIGHTSHIFT
              timeout: 200
          N:
            tap_hold_next_release:
              tap: N
              hold: RIGHTCTRL
              timeout: 200
          I:
            tap_hold_next_release:
              tap: I
              hold: RIGHTALT
              timeout: 200
          X:
            tap_hold_next_release:
              tap: X
              hold: LEFTMETA
              timeout: 200
          DOT:
            tap_hold_next_release:
              tap: DOT
              hold: RIGHTMETA
              timeout: 200

      # In numbers_left T is [, from keymap below.
      homerow_t:
        mode: [default, move_left, move_right, numbers_right]
        remap:
          T:
            tap_hold_next_release:
              tap: T
              hold: LEFTCTRL
              timeout: 200

# Keymap runs after the stages.
keymap:
  - name: left_numbers
    mode: numbers_left
    remap:
      P: Shift-KEY_9          # (
      G: Shift-KEY_0          # )
      T: LEFTBRACE            # [
      D: RIGHTBRACE           # ]
      V: Shift-LEFTBRACE      # {
      B: Shift-RIGHTBRACE     # }
