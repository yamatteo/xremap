# This instance reads the xremap-numpads virtual device, so keys here are
# the letters config.yml already produced, not the raw numpad keycodes.
# Move and numbers modes live in config.yml, so their output never reaches
# the tap-hold below.
experimental_map:
  - remap:
      R:
        tap_hold_next_release:
          tap: R
          hold: LEFTALT
          timeout: 200
      S:
        tap_hold_next_release:
          tap: S
          hold: LEFTSHIFT
          timeout: 200
      T:
        tap_hold_next_release:
          tap: T
          hold: LEFTCTRL
          timeout: 200

      N:
        tap_hold_next_release:
          tap: N
          hold: RIGHTCTRL
          timeout: 200
      E:
        tap_hold_next_release:
          tap: E
          hold: RIGHTSHIFT
          timeout: 200
      I:
        tap_hold_next_release:
          tap: I
          hold: RIGHTALT
          timeout: 200

      # A and O (outer home-row keys) and D and H (inner ones) get no hold
      # modifier, so they are left out and pass through untouched.
